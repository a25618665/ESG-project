name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Audit backend dependencies
        run: npm audit --audit-level=high
      - name: Run backend tests
        run: npm test

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Run frontend component tests
        run: npm test
      - name: Compile frontend
        env:
          VITE_API_URL: http://localhost:3000/
        run: npm run build

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Build application images
        run: docker compose build

      - name: Start the application stack
        run: docker compose up --detach --wait

      - name: Verify the API and frontend
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-connrefused --retry-delay 2 \
            http://localhost:3000/health

          curl --fail --silent --show-error \
            http://localhost:3000/api/companies \
            --output /tmp/companies.json

          python3 - <<'PY'
          import json

          with open("/tmp/companies.json", encoding="utf-8") as response:
              payload = json.load(response)

          records = payload.get("data")
          reported_count = payload.get("meta", {}).get("count")

          if not isinstance(records, list) or reported_count != len(records):
              raise SystemExit("Company API returned an invalid data/count contract")

          if reported_count != 2:
              raise SystemExit(
                  f"Expected 2 illustrative company records, received {reported_count}"
              )
          PY

          curl --fail --silent --show-error \
            http://localhost:8080/ \
            | grep --quiet '<div id="app"></div>'

      - name: Show service diagnostics after a failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop the application stack
        if: always()
        run: docker compose down --volumes
