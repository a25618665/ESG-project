name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  risk-data-pipeline:
    name: Risk data pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install data-tooling dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Test the risk-seed generator
        run: python -m unittest discover --start-directory tools/tests --verbose
      - name: Verify the generated SQL is current
        run: python tools/generate_risk_seed.py --check

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Audit backend dependencies
        run: npm audit --audit-level=high
      - name: Run backend tests
        run: npm test

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
      - name: Run frontend component tests
        run: npm test
      - name: Compile frontend
        env:
          VITE_API_URL: http://localhost:3000/
        run: npm run build

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    needs: [risk-data-pipeline, backend-tests, frontend-build]
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Build application images
        run: docker compose build

      - name: Start the application stack
        run: docker compose up --detach --wait

      - name: Verify the API and frontend
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-connrefused --retry-delay 2 \
            http://localhost:3000/health

          curl --fail --silent --show-error \
            --header 'X-Request-Id: ci-readiness-check' \
            --dump-header /tmp/readiness-headers.txt \
            http://localhost:3000/ready \
            --output /tmp/readiness.json

          curl --fail --silent --show-error \
            http://localhost:3000/api/companies \
            --output /tmp/companies.json

          curl --fail --silent --show-error \
            http://localhost:3000/api/risk-summary \
            --output /tmp/risk-summary.json

          curl --fail --silent --show-error \
            http://localhost:3000/openapi.json \
            --output /tmp/openapi.json

          curl --fail --silent --show-error \
            'http://localhost:3000/api/risk-events?grade=9&companyCode=002628&limit=5&offset=0' \
            --output /tmp/risk-events.json

          python3 - <<'PY'
          import json

          with open("/tmp/companies.json", encoding="utf-8") as response:
              payload = json.load(response)

          records = payload.get("data")
          reported_count = payload.get("meta", {}).get("count")

          if not isinstance(records, list) or reported_count != len(records):
              raise SystemExit("Company API returned an invalid data/count contract")

          if reported_count != 2:
              raise SystemExit(
                  f"Expected 2 illustrative company records, received {reported_count}"
              )

          with open("/tmp/risk-summary.json", encoding="utf-8") as response:
              risk_payload = json.load(response)

          summary = risk_payload.get("data", {})
          expected_metrics = {
              "eventCount": 188,
              "companyCount": 33,
              "majorClassCount": 3,
              "subcategoryCount": 11,
              "numericGradeCount": 7,
              "specialGradeEventCount": 26,
          }

          for metric, expected in expected_metrics.items():
              if summary.get(metric) != expected:
                  raise SystemExit(
                      f"Expected {metric}={expected}, received {summary.get(metric)}"
                  )

          grade_total = sum(
              item.get("count", 0) for item in summary.get("gradeDistribution", [])
          )
          class_total = sum(
              item.get("count", 0) for item in summary.get("classDistribution", [])
          )

          if grade_total != 188 or class_total != 188:
              raise SystemExit("Risk distributions do not reconcile to 188 events")

          with open("/tmp/openapi.json", encoding="utf-8") as response:
              openapi_payload = json.load(response)

          with open("/tmp/readiness.json", encoding="utf-8") as response:
              readiness_payload = json.load(response)

          if readiness_payload != {
              "status": "ready",
              "service": "esg-api",
              "dependencies": {"database": "up"},
          }:
              raise SystemExit(f"Unexpected readiness response: {readiness_payload}")

          with open("/tmp/readiness-headers.txt", encoding="utf-8") as response:
              readiness_headers = response.readlines()

          request_id_headers = [
              line.split(":", 1)[1].strip()
              for line in readiness_headers
              if line.lower().startswith("x-request-id:")
          ]

          if request_id_headers != ["ci-readiness-check"]:
              raise SystemExit(
                  f"Unexpected readiness request ID header: {request_id_headers}"
              )

          expected_paths = {
              "/",
              "/health",
              "/ready",
              "/openapi.json",
              "/api/companies",
              "/api/risk-summary",
              "/api/risk-events",
              "/company",
          }

          if openapi_payload.get("openapi") != "3.1.0" or set(
              openapi_payload.get("paths", {})
          ) != expected_paths:
              raise SystemExit("OpenAPI contract does not match the public route surface")

          with open("/tmp/risk-events.json", encoding="utf-8") as response:
              event_payload = json.load(response)

          events = event_payload.get("data", [])
          event_meta = event_payload.get("meta", {})

          if event_meta != {"total": 17, "count": 5, "limit": 5, "offset": 0}:
              raise SystemExit(f"Unexpected risk-event pagination: {event_meta}")

          if len(events) != 5 or any(
              event.get("ccriGrade") != "9"
              or event.get("companyCode") != "002628"
              for event in events
          ):
              raise SystemExit("Risk-event filters were not applied consistently")
          PY

          curl --fail --silent --show-error \
            http://localhost:8080/ \
            | grep --quiet '<div id="app"></div>'

      - name: Verify graceful backend shutdown
        run: |
          docker compose stop --timeout 15 backend
          docker compose logs --no-color backend \
            | grep --quiet '"event":"server_shutdown_completed"'

      - name: Show service diagnostics after a failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop the application stack
        if: always()
        run: docker compose down --volumes
